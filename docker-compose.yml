services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      STORAGE_DIR: /app/storage
      MAX_UPLOAD_SIZE_MB: 50
      MAX_EXTRACTED_SIZE_MB: 200
      MAX_FEATURES: 100000
      MAX_ZIP_FILES: 10000
    volumes:
      - ./storage:/app/storage
      - ./data:/app/data
    restart: unless-stopped
